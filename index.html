<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Штабель TOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: operator console. Header with role switch, left rail of sections, working tables, record cards in a right-side drawer. */
:root{
  --bg:#ECEFF2;
  --surface:#FFFFFF;
  --surface-2:#F4F6F8;
  --line:#D6DDE3;
  --line-strong:#B4BFC9;
  --fg:#15202B;
  --muted:#5A6774;
  --ink:#1B4F86;
  --accent:#F2B705;
  --on-accent:#1C1600;
  --accent-soft:#FBF0C9;
  --ok:#1C7C45; --ok-soft:#DCF0E3;
  --warn:#A85A00; --warn-soft:#FAEBD5;
  --crit:#BA2C2C; --crit-soft:#F7DDDD;
  --f1:#2E5EA6; --f2:#13837A; --f3:#7550AD; --f4:#AE5F28;
  --dw1:#A9C4DA; --dw2:#5D88AE; --dw3:#E0A33A; --dw4:#C8473B;
  --empty:#E2E7EC;
  --scrim:rgba(14,22,30,.42);
  --shadow:0 18px 48px rgba(16,28,40,.22);
  --font-display:"Oswald","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151B; --surface:#172029; --surface-2:#1D2731; --line:#2A3743; --line-strong:#3D4C5A;
    --fg:#E5EBF0; --muted:#93A2B0; --ink:#86B6EC; --accent:#F2B705; --on-accent:#1C1600; --accent-soft:#3A3012;
    --ok:#4EC27F; --ok-soft:#163324; --warn:#F2A54A; --warn-soft:#3A2810; --crit:#FF7A72; --crit-soft:#3D1A1A;
    --f1:#6D9DE6; --f2:#3FC1B0; --f3:#AD8DE6; --f4:#E3955E;
    --dw1:#3E5C75; --dw2:#6E9CC4; --dw3:#E0A33A; --dw4:#E2604F;
    --empty:#26313C; --scrim:rgba(0,0,0,.55); --shadow:0 18px 48px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#172029; --surface-2:#1D2731; --line:#2A3743; --line-strong:#3D4C5A;
  --fg:#E5EBF0; --muted:#93A2B0; --ink:#86B6EC; --accent:#F2B705; --on-accent:#1C1600; --accent-soft:#3A3012;
  --ok:#4EC27F; --ok-soft:#163324; --warn:#F2A54A; --warn-soft:#3A2810; --crit:#FF7A72; --crit-soft:#3D1A1A;
  --f1:#6D9DE6; --f2:#3FC1B0; --f3:#AD8DE6; --f4:#E3955E;
  --dw1:#3E5C75; --dw2:#6E9CC4; --dw3:#E0A33A; --dw4:#E2604F;
  --empty:#26313C; --scrim:rgba(0,0,0,.55); --shadow:0 18px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono,.cn{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* shell */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);grid-template-areas:"top top" "nav main"}
.top{grid-area:top;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.mark{display:grid;gap:2px;width:28px}
.mark i{display:block;height:7px;border-radius:1px}
.mark i:nth-child(1){width:55%;background:var(--accent)}
.mark i:nth-child(2){background:var(--ink)}
.mark i:nth-child(3){background:var(--fg)}
.brand-name{font-family:var(--font-display);font-size:21px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;line-height:1}
.brand-sub{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.role{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.role select{min-width:0;max-width:62vw;color:var(--fg)}
.today{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
select,textarea,input[type=text],input[type=search],input[type=number],input[type=date],input[type=datetime-local],input:not([type]){background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:7px 10px;min-height:38px;color:var(--fg)}
input::placeholder{color:var(--muted);opacity:.8}
.mono-in{font-family:var(--font-mono);letter-spacing:.03em}

.nav{grid-area:nav;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);align-self:start;display:flex;flex-direction:column;gap:2px;padding:20px 12px 20px 16px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:9px 12px;border:0;border-radius:6px;background:transparent;font-weight:500;text-align:left;cursor:pointer}
.nav button:hover{background:var(--surface)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.nav .cnt{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.nav button[aria-current="page"] .cnt{color:inherit}

.main{grid-area:main;min-width:0;max-width:1320px;display:flex;flex-direction:column;gap:18px;padding-block:22px 56px;padding-inline:8px 28px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head h1{font-family:var(--font-display);font-weight:600;font-size:32px;line-height:1.05;letter-spacing:.02em;text-transform:uppercase;margin-top:4px}
.ribbon{padding:10px 14px;border-radius:6px;background:var(--accent-soft);font-size:13px}
.foot-note{font-size:12px;color:var(--muted);padding-top:6px}

/* tiles, panels */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;padding:14px 16px 16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.tile-l{font-size:12.5px;color:var(--muted);font-weight:500}
.tile-v{font-family:var(--font-display);font-size:40px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.tile-money{font-size:clamp(22px,4.2vw,30px);overflow-wrap:anywhere}
.tile-s{font-size:12.5px;color:var(--muted)}
.tile-crit .tile-v{color:var(--crit)}
.meter{height:6px;border-radius:3px;background:var(--empty);overflow:hidden;margin-top:4px}
.meter span{display:block;height:100%;background:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:12px}
.panel h2{font-size:15px;font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}

.lrows{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;width:100%;padding:9px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.lrow:last-child{border-bottom:0}
button.lrow:hover{background:var(--surface-2)}
.lrow-mid{flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;min-width:0;color:var(--muted);font-size:13px}
.lrow-static,.lrow-empty{cursor:default}
.lrow-empty{color:var(--muted)}
.tier-l{font-size:12px;color:var(--muted);min-width:4.6em}

.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr) 2.6rem;align-items:center;gap:12px}
.bar-l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.bar-t{height:12px;border-radius:3px;background:var(--empty);overflow:hidden}
.bar-t span{display:block;height:100%;border-radius:3px}
.bar-v{text-align:right;font-size:13px}

.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:7.4rem minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.log li:last-child{border-bottom:0}
.log time{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding-top:1px}
.log p{overflow-wrap:anywhere}
.log .log-f{font-size:12px;color:var(--muted)}

/* controls */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
.toolbar select{flex:0 1 auto;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:8px 14px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn-primary:hover{background:var(--accent);filter:brightness(.95)}
.btn-dark{background:var(--fg);border-color:var(--fg);color:var(--surface);font-weight:600}
.btn-dark:hover{background:var(--fg);opacity:.9}
.btn-row,.form-actions{display:flex;flex-wrap:wrap;gap:8px}
.link{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;cursor:pointer;text-align:left}

/* tables */
.count{font-size:13px;color:var(--muted);margin-bottom:8px}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.t th{padding:9px 12px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--surface-2)}
.t .r{text-align:right}
.t .nw{white-space:nowrap}
.t tfoot td{font-weight:600;border-top:1px solid var(--line-strong);background:var(--surface-2)}
.t-compact td,.t-compact th{padding:7px 10px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line-strong);border-radius:8px}

.cn{font-weight:500;letter-spacing:.02em;white-space:nowrap}
.cn b{display:inline-block;margin-left:4px;padding:0 3px;border:1.5px solid currentColor;border-radius:2px;font-weight:700;line-height:1.2}
.cn-big .cn{font-size:26px;font-weight:700}
.pill{display:inline-block;min-width:2.3em;padding:2px 8px;border-radius:999px;font-family:var(--font-mono);font-size:12px;font-weight:700;text-align:center;white-space:nowrap}
.d-norm{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.d-warn{background:var(--warn-soft);color:var(--warn)}
.d-crit{background:var(--crit-soft);color:var(--crit)}
.d-done{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.ftag{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.ftag i{width:9px;height:9px;border-radius:2px;flex:none}

/* drawer */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(600px,100%);overflow-y:auto;overscroll-behavior:contain;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:20px;padding:calc(env(safe-area-inset-top,0px) + 18px) 24px calc(env(safe-area-inset-bottom,0px) + 32px)}
@media (prefers-reduced-motion:no-preference){.drawer:not([hidden]){animation:slidein .2s ease-out}}
@keyframes slidein{from{transform:translateX(28px);opacity:.5}to{transform:none;opacity:1}}
.dr-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dr-title{min-width:0;display:grid;gap:4px}
.dr-title h2{font-size:22px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.x{flex:none;width:38px;height:38px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:16px;color:var(--muted)}
.x:hover{color:var(--fg);background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-block;white-space:nowrap;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.chip.on{background:var(--ok-soft);color:var(--ok);box-shadow:none}
.dr-days{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:2px 16px;padding:14px 16px;border-radius:8px;background:var(--surface-2)}
.dr-days .big{grid-row:span 2;font-family:var(--font-display);font-size:52px;font-weight:600;line-height:.95;font-variant-numeric:tabular-nums}
.big.warn{color:var(--warn)}
.big.crit{color:var(--crit)}
.dd-l{font-weight:600}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.drawer section{display:grid;gap:10px}
.drawer h3{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.thumb{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:4/3;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface-2);cursor:pointer}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;padding:4px 7px;font-size:11px;color:#FFFFFF;background:linear-gradient(transparent,rgba(0,0,0,.7));text-align:left}
.thumb.add{display:grid;place-items:center;padding:8px;border:1.5px dashed var(--line-strong);background:transparent;color:var(--ink);font-size:13px;font-weight:600;text-align:center}
.thumb.add:hover{background:var(--surface-2)}
.thumb.add:focus-within{outline:2px solid var(--ink);outline-offset:2px}

.form{display:grid;gap:14px}
.field{display:grid;gap:5px;min-width:0;margin:0;padding:0;border:0}
.field>label,.field>legend,.lbl{font-size:12.5px;font-weight:600}
.field>legend{padding:0;margin-bottom:5px}
.field input,.field select{width:100%}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cellpick{display:flex;flex-wrap:wrap;gap:8px}
.cellpick select{flex:1 1 96px}
.hint{font-size:12.5px;color:var(--muted)}
.hint.ok{color:var(--ok)}
.hint.err{color:var(--crit)}
.hint.warn{color:var(--warn)}
.form-err{padding:10px 12px;border-radius:6px;background:var(--crit-soft);color:var(--crit);font-weight:500}
.action{display:grid;gap:12px;padding:14px;border:1px solid var(--line);border-radius:8px}
.action h4{font-size:14px;font-weight:600}
.check{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-weight:500}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--ink)}
.check small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.tariff-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:end}

.hist{display:grid;gap:6px}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:left;cursor:pointer}
.hrow:hover{background:var(--surface-2)}
.hrow[aria-current="true"]{background:var(--accent-soft);border-color:transparent}
.hrow .mono{font-size:12.5px}

/* yard */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px}
.legend i.e{background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong)}
.yard{display:grid;gap:16px}
.block{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;align-items:end;gap:12px}
.block-l{font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1}
.bays-wrap{overflow-x:auto;padding-bottom:2px}
.bays{display:grid;grid-template-columns:repeat(15,minmax(20px,1fr));gap:4px;min-width:340px}
.bay{display:flex;flex-direction:column-reverse;gap:2px;padding:3px;border:1px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer}
.bay:hover{border-color:var(--ink)}
.tier{display:block;height:14px;border-radius:2px}
.tier-empty{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.tier.dim{opacity:.18}
.bay-n{font-family:var(--font-mono);font-size:10px;color:var(--muted);text-align:center;line-height:1.3}
.block-occ{font-size:12px;color:var(--muted);padding-bottom:4px}
.tracks{display:grid;gap:12px}
.track{display:grid;grid-template-columns:6rem minmax(0,1fr);gap:12px;align-items:center}
.track-l{display:grid;font-size:13px}
.track-l .mono{font-size:12px;color:var(--muted)}
.rail{display:flex;flex-wrap:wrap;gap:5px;padding:7px 0;background:linear-gradient(var(--line-strong),var(--line-strong)) 0 50%/100% 2px no-repeat}
.wchip{display:grid;gap:1px;padding:4px 7px;border:1.5px solid var(--fc);border-radius:3px;background:var(--surface);cursor:pointer;text-align:left;line-height:1.15}
.wchip .mono{font-size:11.5px;font-weight:500}
.wchip small{font-size:10px;color:var(--muted)}
.wslot{width:58px;min-height:36px;border:1px dashed var(--line);border-radius:3px;background:var(--bg)}

.lightbox{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px 16px;background:rgba(6,10,14,.86);cursor:zoom-out}
.lightbox figure{margin:0;display:grid;gap:10px;max-width:100%}
.lightbox img{max-width:min(960px,100%);max-height:78vh;border-radius:6px;cursor:default}
.lightbox figcaption{color:#E8EDF1;font-size:13px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:70;width:max-content;max-width:calc(100% - 32px);padding:11px 16px;border-radius:6px;background:var(--fg);color:var(--surface);font-weight:500;box-shadow:var(--shadow)}

/* documents, damage, reports */
textarea{width:100%;min-height:64px;resize:vertical;font:inherit}
.dmg-box{display:grid;gap:10px;padding:12px;border-radius:8px;background:var(--surface-2)}
.chip.dmg{background:var(--warn-soft);color:var(--warn);box-shadow:none}
.dmg-mark{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-family:var(--font-body);font-size:11px;font-weight:600;vertical-align:1px}

const toInput = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

function plural(n, a, b, c){ n = Math.abs(n); const n10 = n % 10, n100 = n % 100; if (n10 === 1 && n100 !== 11) return a; if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return b; return c; }

const LV = {};
{ let v = 10; for (const ch of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') { if (v % 11 === 0) v++; LV[ch] = v++; } }
function isoCheck(s10){ let sum = 0; for (let i = 0; i < 10; i++) sum += (i < 4 ? LV[s10[i]] : +s10[i]) * Math.pow(2, i); return sum % 11 % 10; }
const CYR = { 'А':'A','В':'B','Е':'E','К':'K','М':'M','Н':'H','О':'O','Р':'P','С':'C','Т':'T','Х':'X','У':'Y' };
const normCont = s => String(s || '').toUpperCase().replace(/[АВЕКМНОРСТХУ]/g, ch => CYR[ch]).replace(/[^A-Z0-9]/g, '');

  if (!/^[A-Z]{3}[UJZ]\d{7}$/.test(n)) return { ok: false, msg: 'Номер контейнера: 3 буквы владельца, буква U, 6 цифр и контрольная цифра. Пример: QAZU1234564.' };

];

function suggestBay(fwd, exclude){
  const occ = yardOcc(), cnt = {};
  DB.cont.forEach(c => { if (!c.outAt && c.fwd === fwd) cnt[c.cell[0]] = (cnt[c.cell[0]] || 0) + 1; });
  const order = [...BLOCKS].sort((a, b) => (cnt[b] || 0) - (cnt[a] || 0));
  for (const b of order) for (let r = 1; r <= ROWS; r++) { const k = `${b}-${pad2(r)}`; if (k !== exclude && bayHeight(occ, k) < TIERS) return k; }
  return null;
}

const PCOL = ['#8C2F2A', '#2B5C8B', '#3D6C48', '#737A80', '#BE5F1E', '#5A3F6F'];

function marks(g, rec, xr, y, fs){

function genPhoto(rec, view, at){

  g.globalAlpha = .35;
  for (let i = 0; i < 7; i++) { const x = i * 100 - 20 + r() * 30, h = 30 + r() * 50; g.fillStyle = PCOL[Math.floor(r() * PCOL.length)]; g.fillRect(x, 255 - h, 92, h); }
  g.globalAlpha = 1;

  const base = PCOL[hashStr(rec.number.slice(0, 4)) % PCOL.length];
  if (view === 'side') {
    const x = 34, y = 96, w = 572, h = 224;
    g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(x + 6, y + h, w, 12);
    g.fillStyle = base; g.fillRect(x, y, w, h);
    for (let i = x + 16; i < x + w - 16; i += 14) { g.fillStyle = 'rgba(0,0,0,.17)'; g.fillRect(i, y + 12, 5, h - 26); g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(i + 5, y + 12, 3, h - 26); }
    g.fillStyle = 'rgba(0,0,0,.32)'; g.fillRect(x, y, w, 11); g.fillRect(x, y + h - 13, w, 13); g.fillRect(x, y, 14, h); g.fillRect(x + w - 14, y, 14, h);
    g.fillStyle = '#2A2A2A'; [[x, y], [x + w - 18, y], [x, y + h - 15], [x + w - 18, y + h - 15]].forEach(([a, b]) => g.fillRect(a, b, 18, 15));
    marks(g, rec, x + w - 30, y + 48, 30);
  } else {
    const x = 176, y = 66, w = 288, h = 258;
    g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(x + 6, y + h, w, 10);
    g.fillStyle = base; g.fillRect(x, y, w, h);
    for (let j = y + 26; j < y + h - 26; j += 24) { g.fillStyle = 'rgba(0,0,0,.09)'; g.fillRect(x + 14, j, w - 28, 9); }
    g.fillStyle = 'rgba(0,0,0,.32)'; g.fillRect(x, y, w, 12); g.fillRect(x, y + h - 14, w, 14); g.fillRect(x, y, 13, h); g.fillRect(x + w - 13, y, 13, h);
    g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(x + w / 2 - 1, y + 12, 2, h - 26);
    g.fillStyle = '#C3C7CA'; [.16, .36, .64, .84].forEach(p => { const bx = x + w * p - 3; g.fillRect(bx, y + 14, 6, h - 30); g.fillRect(bx - 9, y + h * .6, 24, 7); });
    g.fillStyle = '#E8C21A'; g.fillRect(x + w * .64 + 12, y + h * .6 + 9, 8, 14);
    marks(g, rec, x + w - 24, y + 46, 24);
  }
  const vg = g.createRadialGradient(Wd / 2, Ht / 2, Ht * .25, Wd / 2, Ht / 2, Ht * .9); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.3)'); g.fillStyle = vg; g.fillRect(0, 0, Wd, Ht);
  g.font = '500 14px "JetBrains Mono", monospace'; g.textAlign = 'left'; g.fillStyle = 'rgba(255,255,255,.9)';
  g.fillText(fmtDT(at || rec.inAt), 14, Ht - 14);
  const url = cv.toDataURL('image/jpeg', .82); pcache.set(key, url); return url;
}
const photoUrl = (rec, p) => p.src || genPhoto(rec, p.gen, p.at);
function downscale(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(fr.error);
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('bad image'));
      img.onload = () => {
        const k = Math.min(1, 1280 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', .85));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function seed(){
  const T0 = new Date();
  const ago = (dA, h) => { const d = new Date(T0); d.setDate(d.getDate() - dA); d.setHours(h ?? ri(7, 21), ri(0, 59), 0, 0); return d > T0 ? new Date(T0.getTime() - ri(10, 200) * 60000) : d; };
  const addH = (d, h) => new Date(d.getTime() + h * 3600000);
  const between = (a, b) => new Date(a.getTime() + rnd() * (b.getTime() - a.getTime()));
  const usedC = new Set(), usedW = new Set();
  const newCN = () => { let n; do { const s = pick(OWNERS) + String(ri(0, 999999)).padStart(6, '0'); n = s + isoCheck(s); } while (usedC.has(n)); usedC.add(n); return n; };
  const newWN = kind => { let n; do { const s = KIND_DIGIT[kind] + String(ri(0, 999999)).padStart(6, '0'); n = s + wagCheck(s); } while (usedW.has(n)); usedW.add(n); return n; };
  const plate = () => { const L = 'ABCEHKMOPTX'; return `${ri(100, 999)} ${L[ri(0, 10)]}${L[ri(0, 10)]}${L[ri(0, 10)]} ${pick(['05', '05', '05', '02', '01'])}`; };
  const person = () => `${pick(LAST)} ${pick(FIRST)} ${pick(PATR)}`;
  const sealNo = () => String(ri(1000000, 9999999));
  const pickType = () => { const x = rnd(); return x < .3 ? '20DC' : x < .55 ? '40DC' : '40HC'; };
  const dwell = () => { const x = rnd(); return x < .7 ? ri(0, 20) : x < .92 ? ri(21, 30) : ri(31, 48); };
  const randCell = () => `${pick(BLOCKS)}-${pad2(ri(1, ROWS))}-${ri(1, TIERS)}`;
  const mkC = (fwd, inAt, number) => ({ number: number || newCN(), type: pickType(), laden: rnd() < .8, fwd, inMode: rnd() < .65 ? 'wagon' : 'auto', inRef: '', inWag: null, inAt, outAt: null, outMode: null, outRef: '', outWag: null, cell: '', inCell: '', photos: [], goods: [], inDriver: '', inSeal: '', inDamage: '', inDoc: '', outDriver: '', outSeal: '', outDamage: '', outDoc: '' });

  const conts = [], openList = [];
  for (const [f, n] of [[1, 100], [2, 22], [3, 14], [4, 9]]) for (let i = 0; i < n; i++) { const c = mkC(f, ago(dwell())); conts.push(c); openList.push(c); }
  for (const [f, n] of [[1, 14], [2, 16], [3, 11], [4, 9]]) for (let i = 0; i < n; i++) {
    const c = mkC(f, ago(ri(12, 70)));
    let out = addH(c.inAt, ri(2, 24) * 24 + ri(-5, 6));
    if (out >= T0) out = new Date(T0.getTime() - ri(1, 40) * 3600000);
    if (out <= c.inAt) out = addH(c.inAt, 30);
    c.outAt = out; c.outMode = rnd() < .7 ? 'auto' : 'wagon'; c.outRef = c.outMode === 'auto' ? plate() : newWN('Платформа'); c.cell = randCell();
    conts.push(c);
  }
  // the same container number coming back: older closed visit, new open visit
  const ret = new Set(); while (ret.size < 6) ret.add(openList[ri(0, openList.length - 1)]);
  let k = 0;
  for (const c of ret) {
    const pin = new Date(c.inAt.getTime() - ri(25, 80) * DAY); pin.setHours(ri(7, 20), ri(0, 59));
    const pout = new Date(Math.min(pin.getTime() + ri(3, 18) * DAY, c.inAt.getTime() - DAY));
    const p = mkC(k === 5 ? (c.fwd % 4) + 1 : c.fwd, pin, c.number);
    p.type = c.type; p.outAt = pout; p.outMode = 'auto'; p.outRef = plate(); p.cell = randCell();
    conts.push(p); k++;
  }
  // stack open containers into the yard, oldest at the bottom
  const hgt = {};
  const free = bl => { const o = []; for (const b of bl) for (let r = 1; r <= ROWS; r++) { const kk = `${b}-${pad2(r)}`; if ((hgt[kk] || 0) < TIERS) o.push(kk); } return o; };
  [...openList].sort((a, b) => a.inAt - b.inAt).forEach(c => {
    const pref = c.fwd === 1 ? (rnd() < .6 ? ['A', 'B'] : BLOCKS) : (rnd() < .7 ? ['C', 'D'] : BLOCKS);
    let cand = free(pref); if (!cand.length) cand = free(BLOCKS);
    const kk = pick(cand); hgt[kk] = (hgt[kk] || 0) + 1; c.cell = `${kk}-${hgt[kk]}`;
  });
  conts.forEach(c => {
    const at = new Date(Math.min(c.inAt.getTime() + 12 * 60000, T0.getTime()));
    if (rnd() < (c.outAt ? .5 : .78)) { c.photos.push({ gen: 'side', caption: 'Борт', at }); if (rnd() < .7) c.photos.push({ gen: 'door', caption: 'Двери и пломба', at }); }
  });
  // platforms that brought the containers
  const wags = [], cur = {};
  conts.filter(c => c.inMode === 'wagon').sort((a, b) => a.inAt - b.inAt).forEach(c => {
    const key = c.fwd + '|' + dIdx(c.inAt), u = CT[c.type].size === 20 ? 1 : 2;
    let p = cur[key];
    if (!p || p.units + u > 4) { p = { number: newWN('Платформа'), kind: 'Платформа', fwd: c.fwd, inAt: new Date(c.inAt.getTime() - ri(1, 3) * 3600000), outAt: null, track: '', note: '', units: 0, last: c.inAt }; wags.push(p); cur[key] = p; }
    p.units += u; p.last = c.inAt; c._w = p; c.inRef = p.number;
  });
  wags.forEach(p => { const out = addH(p.last, ri(10, 60)); p.outAt = out > T0 ? null : out; });
  conts.forEach(c => {
    if (c.inMode === 'auto') { c.inRef = plate(); c.inDriver = person(); }
    if (c.laden) c.inSeal = sealNo();
    if (c.laden && rnd() < .5) {
      const t = pick(CARGO_T.filter(x => ['Мешки', 'Коробки', 'Паллеты', 'Ящики', 'Биг-бэги'].includes(x.pack)));
      const q = Math.max(1, Math.round((CT[c.type].size === 20 ? ri(17, 21) : ri(20, 26)) * 1000 / t.unit));

    if (c.outAt) { if (c.outMode === 'auto') c.outDriver = person(); c.outSeal = c.inSeal; if (rnd() < .05) c.outDamage = pick(C_DMG); }
  });

  const isOpenArea = t => ['Связки', 'Пачки'].includes(t.pack);
  const randPlace = t => isOpenArea(t) ? `ОП-${pad2(ri(1, 8))}` : `С1-${pick(['А', 'Б', 'В'])}-${pad2(ri(1, 6))}`;
  const freePlace = t => { for (let i = 0; i < 40; i++) { const p = randPlace(t); if (!usedP.has(p)) { usedP.add(p); return p; } } return randPlace(t); };
  for (let i = 0; i < 26; i++) {
    const t = CARGO_T[i % CARGO_T.length], isOpen = i < 18, fwd = pick([1, 1, 1, 2, 2, 2, 3, 3, 4]);

    let qty0 = ri(t.q[0], t.q[1]); if (t.unit <= 60) qty0 = Math.round(qty0 / 10) * 10;
    const g = { name: t.name, pack: t.pack, qty0, weight0: qty0 * t.unit, fwd, place: isOpen ? freePlace(t) : randPlace(t), inMode: rnd() < .7 ? 'wagon' : 'auto', inRef: '', inWag: null, inAt, outAt: null, ships: [], photos: [], inDriver: '', inDamage: '', inDmgQty: 0, inDoc: '' };
    if (rnd() < .15) { g.inDamage = pick(G_DMG); g.inDmgQty = Math.max(1, Math.round(qty0 * (.005 + rnd() * .01))); }
    if (g.inMode === 'wagon') {
      const w = { number: newWN(t.wk), kind: t.wk, fwd, inAt: new Date(inAt.getTime() - ri(2, 6) * 3600000), outAt: null, track: '', note: '' };
      const out = addH(inAt, ri(12, 54)); w.outAt = out > T0 ? null : out; wags.push(w); g._w = w; g.inRef = w.number;
    } else { g.inRef = plate(); g.inDriver = person(); }

    } else {

    { name: 'Прицеп тракторный самосвальный', pack: 'Без упаковки', qty0: 2, unit: 1750, place: freePlace({ pack: 'Связки' }), dA: 1, fwd: 1 },
    { name: 'Масло подсолнечное 5 л', pack: 'Коробки', qty0: 1800, unit: 16, place: freePlace({ pack: 'Коробки' }), dA: 2, fwd: 3 },
  ].map(s => ({ name: s.name, pack: s.pack, qty0: s.qty0, weight0: s.qty0 * s.unit, fwd: s.fwd, place: s.place, inMode: 'auto', inRef: plate(), inWag: null, inAt: ago(s.dA, 10), outAt: null, ships: [], photos: [], inDriver: person(), inDamage: '', inDmgQty: 0, inDoc: '' }));
  lots.push(...special);
  for (let i = 0; i < 4; i++) wags.push({ number: newWN('Полувагон'), kind: 'Полувагон', fwd: pick([1, 2, 3]), inAt: ago(ri(0, 3)), outAt: null, track: '', note: 'Порожний, под погрузку' });
  for (let i = 0; i < 3; i++) wags.push({ number: newWN('Платформа'), kind: 'Платформа', fwd: pick([1, 2, 3]), inAt: ago(ri(0, 1)), outAt: null, track: '', note: 'Порожняя платформа, под погрузку' });
  // put wagons on tracks
  const tc = {}; TRACKS.forEach(t => tc[t] = 0);
  wags.filter(w => !w.outAt).sort((a, b) => a.inAt - b.inAt).forEach(w => {
    const pref = w.kind === 'Крытый' ? ['Путь 3', 'Путь 4'] : w.kind === 'Платформа' ? ['Путь 1', 'Путь 2'] : TRACKS;
    let opts = pref.filter(t => tc[t] < TRACK_CAP); if (!opts.length) opts = TRACKS.filter(t => tc[t] < TRACK_CAP);
    if (!opts.length) { w.outAt = new Date(T0.getTime() - 3600000); w.track = TRACKS[0]; return; }
    const t = opts.sort((a, b) => tc[a] - tc[b])[0]; w.track = t; tc[t]++;
  });
  wags.filter(w => !w.track).forEach(w => { w.track = pick(TRACKS); });
  // visit numbers in arrival order
  conts.sort((a, b) => a.inAt - b.inAt).forEach((c, i) => { c.id = i + 1; });
  wags.sort((a, b) => a.inAt - b.inAt).forEach((w, i) => { w.id = i + 1; });
  lots.sort((a, b) => a.inAt - b.inAt).forEach((g, i) => { g.id = i + 1; });
  conts.forEach(c => { if (c._w) c.inWag = c._w.id; delete c._w; });
  lots.forEach(g => { if (g._w) g.inWag = g._w.id; delete g._w; });
  wags.forEach(w => { delete w.units; delete w.last; });
  // extra-service requests
  const orders = [], usedR = new Set();
  const mkO = (kind, rec, at, source, items, status, note, doneH) => {
    if (!rec) return;
    usedR.add(rec);
    const o = { id: 0, no: '', fwd: rec.fwd, kind, rid: rec.id, at, source, status, note, doneAt: null, act: '', rep: '', worker: '', cancelReason: '',
      items: items.map(([sid, plan, fact]) => { const s = SERVICES.find(x => x.id === sid); return { svc: sid, name: s.name, unit: s.unit, price: s.price, plan, fact: fact ?? plan }; }) };
    if (status === 'done') { o.doneAt = new Date(Math.min(at.getTime() + doneH * 3600000, T0.getTime() - 60000)); o.rep = person(); o.worker = pick(['Бригада № 1', 'Бригада № 2', 'Крановщик Тулегенов Е.', 'Водитель погрузчика Сапаров А.']); }
    if (status === 'cancel') o.cancelReason = 'Клиент отказался';
    orders.push(o);
  };
  const pickOne = list => { const l = list.filter(x => !usedR.has(x)); return l.length ? l[ri(0, l.length - 1)] : null; };
  const openC40 = conts.filter(c => !c.outAt && c.laden && CT[c.type].size === 40 && T0 - c.inAt > 3 * DAY);
  const openC20 = conts.filter(c => !c.outAt && c.laden && CT[c.type].size === 20 && T0 - c.inAt > 2 * DAY);
  const ago_h = h => new Date(T0.getTime() - h * 3600000);
  const [trailer, oil] = special;
  mkO('g', trailer, addH(trailer.inAt, .2), 'На месте', [['crane', 2, 2]], 'done', 'Снять два прицепа с трала и поставить на открытую площадку', 1.5);
  mkO('g', oil, addH(oil.inAt, .1), 'Письмо или мессенджер', [['manual', 28.8], ['pallet', 30, 32], ['stretch', 30, 32]], 'done', 'Фура, коробки навалом. Выгрузить вручную, собрать на паллеты по 56 коробок', 6);
  let c = pickOne(openC40); if (c) mkO('c', c, addH(c.inAt, 26), 'Звонок', [['strip40', 1]], 'done', 'Растарка для таможенного досмотра, груз на склад', 5);
  c = pickOne(openC40); if (c) mkO('c', c, addH(c.inAt, 30), 'Звонок', [['reseal', 1]], 'done', 'Перепломбировка после досмотра', 1);
  c = pickOne(openC40); mkO('c', c, ago_h(5), 'Письмо или мессенджер', [['weigh', 1]], 'work', 'Контрольное взвешивание перед отправкой');
  c = pickOne(openC40); mkO('c', c, ago_h(2), 'Кабинет экспедитора', [['inspect', 1], ['shift', 1]], 'new', 'Предоставить к досмотру, инспектор будет завтра в 10:00');
  c = pickOne(openC20); mkO('c', c, ago_h(.7), 'Кабинет экспедитора', [['strip20', 1]], 'new', 'Растарка, груз разместить на складе');
  c = pickOne(openC20); mkO('c', c, ago_h(30), 'Звонок', [['weigh', 1]], 'cancel', 'Взвешивание');
  const openLots = lots.filter(g => !g.outAt && !special.includes(g) && T0 - g.inAt > DAY);
  const sugar = pickOne(openLots.filter(g => g.pack === 'Мешки'));
  mkO('g', sugar, ago_h(3), 'Кабинет экспедитора', [['pallet', 20], ['stretch', 20]], 'new', 'Собрать мешки на паллеты перед отгрузкой');
  const rebar = pickOne(openLots.filter(g => g.pack === 'Связки'));
  mkO('g', rebar, ago_h(6), 'Звонок', [['crane', 3]], 'work', 'Погрузить связки краном на трал');
  const tiles = pickOne(lots.filter(g => g.pack === 'Паллеты' && T0 - g.inAt > DAY));
  if (tiles) mkO('g', tiles, addH(tiles.inAt, .3), 'На месте', [['forklift', Math.round(tiles.weight0 / 100) / 10]], 'done', 'Выгрузка паллет погрузчиком', 3);
  orders.sort((a, b) => a.at - b.at).forEach((o, i) => { o.id = i + 1; });
  // document numbers in date order
  const dev = [];
  orders.forEach(o => { dev.push({ at: o.at, k: 'ord', set: no => { o.no = no; } }); if (o.doneAt) dev.push({ at: o.doneAt, k: 'svc', set: no => { o.act = no; } }); });
  conts.forEach(c => { dev.push({ at: c.inAt, k: docKind(c.inMode), set: no => { c.inDoc = no; } }); if (c.outAt) dev.push({ at: c.outAt, k: docKind(c.outMode), set: no => { c.outDoc = no; } }); });
  lots.forEach(g => { dev.push({ at: g.inAt, k: 'act', set: no => { g.inDoc = no; } }); g.ships.forEach(s => dev.push({ at: s.at, k: 'act', set: no => { s.doc = no; } })); });
  dev.sort((a, b) => a.at - b.at).forEach(d => d.set(nextDoc(d.k)));
  // journal
  const ev = [];
  conts.forEach(c => { ev.push({ at: c.inAt, fwd: c.fwd, text: `Принят контейнер ${c.number} → ${c.cell}` }); if (c.outAt) ev.push({ at: c.outAt, fwd: c.fwd, text: `Выпущен контейнер ${c.number}, ${c.outMode === 'auto' ? 'авто' : 'вагон'} ${c.outRef}` }); });
  wags.forEach(w => { ev.push({ at: w.inAt, fwd: w.fwd, text: `Прибыл вагон ${w.number} (${w.kind.toLowerCase()}) → ${w.track}` }); if (w.outAt) ev.push({ at: w.outAt, fwd: w.fwd, text: `Убыл вагон ${w.number}` }); });
  lots.forEach(g => { ev.push({ at: g.inAt, fwd: g.fwd, text: `Принят генгруз: ${g.name}, ${qtyTxt(g.qty0, g.pack)} → ${g.place}` }); g.ships.forEach(s => ev.push({ at: s.at, fwd: g.fwd, text: `Отгружено: ${g.name}, ${qtyTxt(s.qty, g.pack)}` })); });
  orders.forEach(o => {
    const r = o.kind === 'c' ? conts.find(x => x.id === o.rid) : lots.find(x => x.id === o.rid), what = o.kind === 'c' ? `контейнер ${r.number}` : r.name;
    ev.push({ at: o.at, fwd: o.fwd, text: `Заявка ${o.no}: ${o.items.map(i => i.name.toLowerCase()).join(', ')} · ${what}` });
    if (o.doneAt) ev.push({ at: o.doneAt, fwd: o.fwd, text: `Выполнена заявка ${o.no}, акт оказанных услуг ${o.act}` });
  });
  const from = T0.getTime() - 6 * DAY;
  DB.cont = conts; DB.wag = wags; DB.cargo = lots; DB.orders = orders;
  DB.log = ev.filter(e => e.at.getTime() >= from).sort((a, b) => b.at - a.at);
  Object.assign(DB.seq, { c: conts.length + 1, w: wags.length + 1, g: lots.length + 1 });
}

function lCont(){
  const T = S.role === 'terminal', f = S.f.c;

function vYard(){
  const occ = yardOcc(), y = S.f.yard, hl = +y.hl || 0;
  const total = BLOCKS.length * ROWS * TIERS, used = DB.cont.filter(c => !c.outAt).length;
  const blocks = BLOCKS.map(b => {
    let n = 0;
    const bays = Array.from({ length: ROWS }, (_, i) => {
      const k = `${b}-${pad2(i + 1)}`, st = occ[k] || [];
      let tiers = '';
      for (let t = 1; t <= TIERS; t++) {
        const c = st[t];
        if (c) { n++; tiers += `<span class="tier${hl && c.fwd !== hl ? ' dim' : ''}" style="background:${y.color === 'fwd' ? fcol(c.fwd) : dwCol(days(c.inAt))}"></span>`; }
        else tiers += '<span class="tier tier-empty"></span>';
      }
      return `<button type="button" class="bay" data-act="bay" data-k="${k}" aria-label="Ряд ${k}: занято ${st.filter(Boolean).length} из ${TIERS}"><span class="bay-n">${pad2(i + 1)}</span>${tiers}</button>`;
    }).join('');
    return `<div class="block"><div class="block-l">${b}</div><div class="bays-wrap"><div class="bays">${bays}</div></div><div class="block-occ mono">${n}/${ROWS * TIERS}</div></div>`;
  }).join('');
  const legend = y.color === 'fwd'
    ? FWD.map(f => `<span><i style="background:${fcol(f.id)}"></i>${esc(f.name)}</span>`).join('')
    : [['var(--dw1)', 'до 7 суток'], ['var(--dw2)', '8–20'], ['var(--dw3)', '21–30'], ['var(--dw4)', 'больше 30']].map(([c, l]) => `<span><i style="background:${c}"></i>${l}</span>`).join('');
  const tracks = TRACKS.map(tr => {
    const ws = DB.wag.filter(w => !w.outAt && w.track === tr).sort((a, b) => a.inAt - b.inAt);
    const chips = ws.map(w => `<button type="button" class="wchip" data-act="open-w" data-id="${w.id}" style="--fc:${fcol(w.fwd)}" aria-label="Вагон ${w.number}, ${esc(w.kind)}, ${esc(fwdById(w.fwd).name)}"><span class="mono">${w.number}</span><small>${KIND_SHORT[w.kind]}</small></button>`).join('');
    const slots = Array.from({ length: Math.max(0, TRACK_CAP - ws.length) }, () => '<span class="wslot" aria-hidden="true"></span>').join('');
    return `<div class="track"><div class="track-l"><b>${tr}</b><span class="mono">${ws.length}/${TRACK_CAP}</span></div><div class="rail">${chips}${slots}</div></div>`;
  }).join('');
  return `
  <div class="page-head"><div><p class="eyebrow">${BLOCKS.length} блока × ${ROWS} рядов × ${TIERS} яруса · занято ${used} из ${total}</p><h1>Площадка</h1></div></div>
  <div class="toolbar">
    ${seg('yard', 'color', [['fwd', 'Цвет: экспедитор'], ['dwell', 'Цвет: срок хранения']])}
    <select id="fy-hl" data-filter="yard.hl" aria-label="Подсветить экспедитора"><option value="">Подсветить: все</option>${FWD.map(f => `<option value="${f.id}" ${hl === f.id ? 'selected' : ''}>Подсветить: ${esc(f.name)}</option>`).join('')}</select>
  </div>
  <section class="panel"><div class="panel-head"><h2>Контейнерная площадка</h2><div class="legend">${legend}<span><i class="e"></i>свободно</span></div></div>
    <div class="yard">${blocks}</div><p class="note" style="margin-top:12px">Каждый столбик — ряд из трёх ярусов, нижний стоит на земле. Нажмите на ряд, чтобы увидеть контейнеры.</p></section>
  <section class="panel"><div class="panel-head"><h2>Железнодорожные пути</h2><p class="note">Рамка вагона — цвет экспедитора</p></div><div class="tracks">${tracks}</div></section>`;
}

function lFwd(){

    return { f, n: cs.length, w: DB.wag.filter(w => w.fwd === f.id && !w.outAt).length, g: DB.cargo.filter(g => g.fwd === f.id && !g.outAt).length, long: cs.filter(c => days(c.inAt) > 30).length, paid: bs.reduce((s, b) => s + b.paid, 0), sum: bs.reduce((s, b) => s + b.sum, 0), svc: svc30(f.id) };

}

  for (let t = TIERS; t >= 1; t--) {

function contHint(raw){

function arCheck(rows){

  return rows.map(r => {

    const err = m => { res.st = 'err'; res.msg = m; return res; };
    if (!r.w) return err('Нет номера вагона');
    const vw = validateWag(r.w); if (!vw.ok) return err(vw.msg);
    if (DB.wag.some(x => x.number === r.w && !x.outAt)) return err('Этот вагон уже стоит на путях');
    const tr = r.t ? arTrack(r.t) : null;
    if (r.t && !tr) return err(`Путь «${r.t}» не найден. Есть пути с 1 по ${TRACKS.length}`);
    let w0 = wags[r.w];
    if (!w0) {
      if (!tr) return err('Укажите путь в первой строке этого вагона');
      if (trackLoad(tr) + (trackAdd[tr] || 0) >= TRACK_CAP) return err(`${tr} занят полностью`);
      trackAdd[tr] = (trackAdd[tr] || 0) + 1;
      w0 = wags[r.w] = { track: tr, kind: WKIND_BY_DIGIT[r.w[0]] || 'Прочий', units: 0, line: r.line };
    } else if (tr && tr !== w0.track) return err(`Этот вагон уже указан на ${w0.track.toLowerCase()} в строке ${w0.line}`);

      if (!(kg > 0)) return err('Укажите вес груза в кг');
      res.goods = { name: r.g, pack: pack || 'Без упаковки', qty: Math.round(q), weight: Math.round(kg) };
      if (!pack) notes.push(`упаковка «${r.p}» не из списка`);
    }
    if (r.c) {
      if (!validateCont(r.c).ok) return err(/^[A-Z]{3}[UJZ]\d{7}$/.test(r.c) ? 'Не сходится контрольная цифра номера контейнера' : 'Неверный формат номера контейнера');

        res.msg = `Ещё один товар в контейнере из строки ${prev.line}`;
      } else {
        if (DB.cont.some(x => x.number === r.c && !x.outAt)) return err('Контейнер уже числится на терминале');
        let ty = arType(r.type);
        if (ty === undefined) return err(`Тип «${r.type}» не распознан. Пишите 20, 40 или 40HC`);
        if (ty === null) { ty = '40DC'; notes.push("тип не указан, принят 40'"); }
        const u = CT[ty].size === 20 ? 1 : 2;
        if (w0.units + u > 4) return err('Не помещается: на платформе уже 80 футов');
        w0.units += u;
        conts[r.c] = { w: r.w, line: r.line, type: ty, fwd: f.id };
        if (w0.kind !== 'Платформа') notes.push(`вагон ${w0.kind.toLowerCase()}, не платформа`);

      }

      if (!res.goods) return err('Нет ни контейнера, ни груза');

    case 'bulk': openBulk(); break;
    case 'arrival': openArrival(); break;
    case 'ar-example': { const ta = $('#ar-text'); if (ta) ta.value = arExampleText(); arRows = arCheck(arParse(blMatrixFromText(val('ar-text')))); arRender(); break; }
    case 'ar-check': arRows = arCheck(arParse(blMatrixFromText(val('ar-text')))); arRender(); break;
    case 'ar-template': offerFile('Шаблон прибытия вагонов', wb => arTemplateSheet(wb), t); break;
    case 'bl-example': { const ta = $('#bl-text'); if (ta) ta.value = blExampleText(); blRows = blCheck(blParse(blMatrixFromText(val('bl-text')))); blRender(); break; }
    case 'bl-check': blRows = blCheck(blParse(blMatrixFromText(val('bl-text')))); blRender(); break;
    case 'bl-template': offerFile('Шаблон погрузки на вагоны', wb => templateSheet(wb), t); break;
    case 'open-o': openOrder(id); break;
    case 'new-o': newOrder(t.dataset.kind, id || null); break;
    case 'o-work': {
      const o = DB.orders.find(x => x.id === id); if (!o || o.status !== 'new' || S.role !== 'terminal') break;
      o.status = 'work'; log(o.fwd, `Заявка ${o.no} взята в работу`); toast(`Заявка ${o.no} в работе`); render(); openOrder(o.id); break;
    }
    case 'dl': {
      const kind = t.dataset.doc; let d = null;
      if (kind === 'load') { if (blLast) { const L = blLast; offerFile(`Ведомость погрузки ${L.no}`, wb => repSheet(wb, loadSheet(L)), t); } break; }
      if (kind === 'arr') { if (arLast) { const L = arLast; offerFile(`Ведомость прибытия ${L.no}`, wb => repSheet(wb, arrivalSheet(L)), t); } break; }
      if (kind === 'c-in' || kind === 'c-out') { const c = C(id); if (c && isMine(c)) d = docForContainer(c, kind === 'c-in' ? 'in' : 'out'); }
      else if (kind === 'o-req' || kind === 'o-act') { const o = DB.orders.find(x => x.id === id); if (o && isMine(o)) d = docForOrder(o, kind === 'o-act'); }
      else { const g = G(id); if (g && isMine(g)) d = docForCargo(g, kind === 'g-ship' ? +t.dataset.i : null); }
      if (d) offerFile(d.file, wb => docSheet(wb, d), t);
      break;
    }
    case 'dl-rep': { const r = repData(S.rep.id); offerFile(r.file, wb => { repSheet(wb, r); (r.extra || []).forEach(x => repSheet(wb, x)); }, t); break; }
    case 'rep': S.rep.id = t.dataset.rid; render(); break;
    case 'rep-days': S.rep.from = ymd(daysAgo(+t.dataset.n)); S.rep.to = ymd(new Date()); render(); break;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'role') { S.role = el.value === 'terminal' ? 'terminal' : +el.value; S.tab = 'summary'; closeDrawer(); render(); window.scrollTo(0, 0); return; }
  if (el.dataset.filter) { const [sc, k] = el.dataset.filter.split('.'); S.f[sc][k] = el.value; if (sc === 'yard') render(); else renderList(); return; }
  if (el.dataset.setting) { const k = el.dataset.setting; S[k] = el.type === 'checkbox' ? el.checked : Math.max(0, parseInt(el.value, 10) || 0); renderList(); return; }
  if (el.dataset.rep) { S.rep[el.dataset.rep] = el.value; renderList(); return; }
  if (el.dataset.live) live(el);
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.matches && el.matches('input[type=file][data-load-file]')) {
    const file = el.files[0]; el.value = ''; if (!file) return;
    const fl = $('#bl-file'); if (fl) fl.textContent = file.name;
    try { blRows = blCheck(blParse(await blReadFile(file))); }
    catch (err) { toast('Не удалось прочитать файл. Сохраните его как .xlsx или CSV и попробуйте снова.'); return; }
    blRender(); return;
  }
  if (el.matches && el.matches('input[type=file][data-arrival-file]')) {
    const file = el.files[0]; el.value = ''; if (!file) return;
    const fl = $('#ar-file'); if (fl) fl.textContent = file.name;
    try { arRows = arCheck(arParse(await blReadFile(file, AR_HEAD.length))); }
    catch (err) { toast('Не удалось прочитать файл. Сохраните его как .xlsx или CSV и попробуйте снова.'); return; }
    arRender(); return;
  }
  if (!el.matches || !el.matches('input[type=file][data-upload]')) return;
  const files = [...el.files]; if (!files.length) return;
  const kind = el.dataset.upload, id = +el.dataset.id, srcs = [];
  for (const file of files) { try { srcs.push(await downscale(file)); } catch (err) { /* skip unreadable file */ } }
  el.value = '';
  if (!srcs.length) return toast('Не удалось прочитать фото. Попробуйте другой файл.');
  if (kind === 'pending') { pending.push(...srcs); renderPending(); return; }
  const rec = kind === 'c' ? C(id) : G(id); if (!rec) return;
  srcs.forEach(src => rec.photos.push({ src, caption: 'Фото', at: new Date() }));
  log(rec.fwd, `Добавлено фото: ${kind === 'c' ? 'контейнер ' + rec.number : rec.name} (${srcs.length})`);
  toast(`Добавлено фото: ${srcs.length}`); render(); kind === 'c' ? openC(id) : openG(id);
});
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target, h = H[f.dataset.form]; if (h) h(f); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#lightbox').hidden) closeLb(); else if (!$('#drawer').hidden) closeDrawer(); }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-act]')) e.target.click();
});

/* ---------- start ---------- */
seed();
$('#role').innerHTML = '<option value="terminal">Терминал (оператор)</option>' + FWD.map(f => `<option value="${f.id}">Экспедитор: ${esc(f.name)}</option>`).join('');
$('#today').textContent = `Сегодня ${fmtD(now())}`;
render();
})();
</script>
